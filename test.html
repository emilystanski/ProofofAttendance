<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Lanyards - Proof of Attendance</title>

<style>

/* RESET (important for beginners) */
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

/* GENERAL */
body {
  font-family: Arial, Helvetica, sans-serif;
  background: #92be84;
  color: black;
  display: flex;
  flex-direction: column;
  min-height: 100vh;
}

/* TOP LINE */
.green-line {
  height: 5px;
  background: black;
}

/* HEADER */
.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 20px 40px; /* FIXED (was % before) */
  background: white;
}

.logo {
  font-size: 30px;
  font-weight: bold;
}

.nav-links {
  display: flex;
  gap: 30px;
  list-style: none;
}

/* DROPDOWN */
.dropdown {
  position: relative;
}

.dropbtn {
  background: none;
  border: none;
  font-size: 18px;
  cursor: pointer;
  font-weight: bold;
}

.dropdown-menu {
  display: none;
  position: absolute;
  top: 30px;
  background: black;
  list-style: none;
  padding: 10px 0;
}

.dropdown-menu li {
  padding: 10px 20px;
}

.dropdown-menu a {
  color: white;
  text-decoration: none;
}

.dropdown.active .dropdown-menu {
  display: block;
}

/* MAIN CONTAINER */
.container {
  max-width: 1200px;
  margin: auto;
  padding: 30px 40px; /* FIXED margins */
  display: flex;
  flex-direction: column;
  gap: 50px;
}

/* SECTIONS */
.section {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
}

.main-image {
  width: 100%;
  height: 400px;
  background: linear-gradient(to right, #222, #444);
  border-radius: 10px;
}

.text {
  padding: 10px;
}

/* TABLE */
.info-table {
  width: 100%;
  border-collapse: collapse;
  margin-bottom: 20px;
}

.info-table th,
.info-table td {
  border: 1px solid black;
  padding: 8px;
  text-align: center;
}

/* TEXT */
h1 {
  text-align: center;
  font-size: 60px;
  margin: 20px 0;
}

h2 {
  grid-column: span 2;
  font-size: 35px;
}

.description {
  margin-top: 10px;
  font-size: 18px;
}

/* BOTTOM LINKS */
.bottom-links {
  display: flex;
  gap: 20px;
  margin-top: 20px;
}

.link-box {
  flex: 1;
  text-align: center;
}

.link-box img {
  width: 100%;
  height: 120px;
  object-fit: cover;
  border-radius: 8px;
}

/* FOOTER */
footer {
  background: black;
  color: white;
  padding: 40px;
  margin-top: auto;
}

.footer-columns {
  display: flex;
  justify-content: space-between;
  flex-wrap: wrap;
}

.footer-column {
  min-width: 150px;
  margin-bottom: 20px;
}

.footer-column a,
.footer-column p {
  display: block;
  color: #ccc;
  text-decoration: none;
  margin: 5px 0;
}

</style>
</head>

<body>

<!-- HEADER -->
<div class="header">
  <div class="logo">Proof of Attendance</div>

  <ul class="nav-links">
    <li class="dropdown">
      <button class="dropbtn">Year</button>
      <ul class="dropdown-menu">
        <li><a href="#">2016</a></li>
        <li><a href="#">2017</a></li>
      </ul>
    </li>
  </ul>
</div>

<div class="green-line"></div>

<h1>Lanyards</h1>

<!-- MAIN -->
<div class="container">

  <!-- 2016 -->
  <section class="section">
    <h2>2016</h2>

    <div class="main-image"></div>

    <div class="text">
      <table class="info-table">
        <tr>
          <th>Year</th>
          <th>Team</th>
          <th>Role</th>
        </tr>
        <tr>
          <td>2016</td>
          <td>Ottawa</td>
          <td>Coach</td>
        </tr>
      </table>

      <div class="description">
        Example description text here.
      </div>

      <div class="bottom-links">
        <div class="link-box">
          <img src="Homepage/HM1.jpg">
        </div>
        <div class="link-box">
          <img src="Homepage/HM2.JPG">
        </div>
      </div>
    </div>
  </section>

  <!-- 2017 -->
  <section class="section">
    <h2>2017</h2>

    <div class="main-image"></div>

    <div class="text">
      <table class="info-table">
        <tr>
          <th>Year</th>
          <th>Team</th>
          <th>Role</th>
        </tr>
        <tr>
          <td>2017</td>
          <td>Ottawa</td>
          <td>Coach</td>
        </tr>
      </table>

      <div class="description">
        Another description here.
      </div>
    </div>
  </section>

</div>

<!-- FOOTER -->
<footer>
  <div class="footer-columns">
    <div class="footer-column">
      <h3>About</h3>
      <p>Project</p>
    </div>

    <div class="footer-column">
      <h3>Year</h3>
      <p>2016</p>
      <p>2017</p>
    </div>
  </div>
</footer>

<!-- DROPDOWN SCRIPT -->
<script>
document.querySelectorAll(".dropbtn").forEach(button => {
  button.addEventListener("click", function(e) {
    e.stopPropagation();

    document.querySelectorAll(".dropdown").forEach(drop => {
      if (drop !== this.parentElement) {
        drop.classList.remove("active");
      }
    });

    this.parentElement.classList.toggle("active");
  });
});

document.addEventListener("click", function() {
  document.querySelectorAll(".dropdown").forEach(drop => {
    drop.classList.remove("active");
  });
});
</script>

</body>
</html>
